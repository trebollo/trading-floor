[project]
name = "trading-floor"
version = "0.1.0"
description = "Sistema multiagente de trading algorítmico autónomo — Fase 0: cimientos"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "nats-py>=2.9",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["infra: tests de integración con infraestructura (NATS/Postgres)"]
