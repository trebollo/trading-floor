# Model Gateway: los modelos son configuración, no código (§7.1).
# kind: generative (escribe) | evaluator (decide — Jev, sin generación de texto).
# Todo el tráfico va por OpenCode Zen con una sola credencial (OPENCODE_API_KEY):
# generativos por /zen/go/v1 y Jev por /zen/v1. Queda soportado vercel-ai-gateway
# como proveedor alternativo. Si falta la key, el agente degrada a su ruta
# determinista y audita el failover. Sin secretos aquí.

models:
  jev:
    kind: evaluator
    id: jev-1.13-free            # System One de TypeSafe AI, variante gratuita de OpenCode Zen
    provider: opencode-go
    endpoint: https://opencode.ai/zen/v1
    api_key_env: OPENCODE_API_KEY
    input_cost_per_mtok: 0.0
    context_window: 32000
  frontier-strong:               # para hipótesis y análisis que exigen calidad
    kind: generative
    id: gpt-6-luna               # OpenCode Go — protocolo Responses
    provider: opencode-go
    protocol: responses
    endpoint: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_API_KEY
    tier: standard
  frontier-lite:                 # para redacción y tareas voluminosas de bajo coste
    kind: generative
    id: glm-5.3-flash            # OpenCode Go — protocolo chat/completions
    provider: opencode-go
    protocol: chat-completions
    endpoint: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_API_KEY
    tier: economic

agents:
  research-hypothesis:
    generative: frontier-strong
    decisions: jev
  research-coder:
    generative: frontier-strong
  research-curator:
    generative: frontier-lite
    decisions: jev
  backtest-engineer:
    generative: frontier-lite
  backtest-analyst:
    generative: frontier-lite
    decisions: jev
  validation-quant:
    generative: frontier-strong
    decisions: jev
  validation-skeptic:
    generative: frontier-strong
  risk-pretrade:
    generative: frontier-lite    # solo redacta motivos; la decisión es determinista
    decisions: jev
  risk-portfolio:
    generative: frontier-lite
    decisions: jev
  execution-router: {}           # determinista: sin LLM en el camino de la orden
  ops-monitor:
    generative: frontier-lite
    decisions: jev
  macro-analyst:
    generative: frontier-lite
    decisions: jev
  news-analyst:
    generative: frontier-lite
    decisions: jev
  chief-of-staff:
    generative: frontier-strong
    decisions: jev
