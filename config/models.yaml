# Model Gateway: los modelos son configuración, no código (§7.1).
# kind: generative (escribe) | evaluator (decide — Jev, sin generación de texto).
# provider + api_key_env: credencial leída del entorno en arranque; si falta, el
# agente degrada a su ruta determinista y audita el failover. Sin secretos aquí.

models:
  jev:
    kind: evaluator
    id: typesafe-ai/jev          # System One de TypeSafe AI vía Vercel AI Gateway
    provider: vercel-ai-gateway
    endpoint: https://ai-gateway.vercel.sh/typesafe/v1
    api_key_env: AI_GATEWAY_API_KEY
    input_cost_per_mtok: 0.042
    context_window: 32000
  frontier-strong:               # para hipótesis y análisis que exigen calidad
    kind: generative
    id: gpt-6-luna               # OpenCode Go
    provider: opencode-go
    endpoint: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_API_KEY
    tier: standard
  frontier-lite:                 # para redacción y tareas voluminosas de bajo coste
    kind: generative
    id: glm-5.3-flash            # OpenCode Go
    provider: opencode-go
    endpoint: https://opencode.ai/zen/go/v1
    api_key_env: OPENCODE_API_KEY
    tier: economic

agents:
  research-hypothesis:
    generative: frontier-strong
    decisions: jev
  research-coder:
    generative: frontier-strong
  research-curator:
    generative: frontier-lite
    decisions: jev
  backtest-engineer:
    generative: frontier-lite
  backtest-analyst:
    generative: frontier-lite
    decisions: jev
  validation-quant:
    generative: frontier-strong
    decisions: jev
  validation-skeptic:
    generative: frontier-strong
  risk-pretrade:
    generative: frontier-lite    # solo redacta motivos; la decisión es determinista
    decisions: jev
  risk-portfolio:
    generative: frontier-lite
    decisions: jev
  execution-router: {}           # determinista: sin LLM en el camino de la orden
  ops-monitor:
    generative: frontier-lite
    decisions: jev
  macro-analyst:
    generative: frontier-lite
    decisions: jev
  news-analyst:
    generative: frontier-lite
    decisions: jev
  chief-of-staff:
    generative: frontier-strong
    decisions: jev
